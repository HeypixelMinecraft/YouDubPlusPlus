name: Build YouDubPlusPlus

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  smoke:
    name: Fast smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: requirements-ci-lite.txt

      - name: Set up Python
        run: uv python install 3.12

      - name: Create test environment
        run: |
          uv venv --python 3.12 .venv
          uv pip install -r requirements-ci-lite.txt

      - name: Run backend smoke tests
        run: |
          uv run python -m pytest backend/tests/test_index_tts.py backend/tests/test_pipeline.py backend/tests/test_settings_and_api.py

      - name: Compile sources
        run: |
          uv run python -m compileall apps/desktop/youdub_desktop apps/desktop/main.py backend/app

  desktop:
    name: Full desktop build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows desktop
            artifact: YouDubPlusPlus-windows
          - os: macos-latest
            name: macOS desktop
            artifact: YouDubPlusPlus-macos
          - os: ubuntu-latest
            name: Linux desktop
            artifact: YouDubPlusPlus-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements-ci.txt
            requirements-desktop-gpu.txt

      - name: Set up Python
        run: uv python install 3.11

      - name: Create environment
        run: |
          uv venv --python 3.11 .venv
          uv pip install -r requirements-ci.txt
          uv pip install -r requirements-desktop-gpu.txt
          uv pip install --upgrade pyinstaller

      - name: Install CPU PyTorch
        run: |
          uv pip install torch torchaudio

      - name: Resolve Python executable
        id: python
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "exe=.venv/Scripts/python.exe" >> "$GITHUB_OUTPUT"
          else
            echo "exe=.venv/bin/python" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile desktop sources
        shell: pwsh
        run: |
          & "${{ steps.python.outputs.exe }}" -m compileall apps/desktop/youdub_desktop apps/desktop/main.py backend/app

      - name: Import desktop entrypoint
        shell: pwsh
        run: |
          & "${{ steps.python.outputs.exe }}" -c "import sys; sys.path.insert(0, 'apps/desktop'); import youdub_desktop.main; from youdub_desktop.ui.app_window import AppWindow; print('desktop imports ok')"

      - name: Build desktop package
        shell: pwsh
        env:
          YOUDUB_BUNDLE_GPU_DEPS: "1"
        run: |
          & "${{ steps.python.outputs.exe }}" -m PyInstaller --clean --noconfirm apps/desktop/YouDubPlusPlus.spec

      - name: Create Windows ZIP package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/YouDubPlusPlus/* -DestinationPath dist/YouDubPlusPlus-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/YouDubPlusPlus

      - name: Upload Windows ZIP package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: YouDubPlusPlus-windows-zip
          path: dist/YouDubPlusPlus-windows.zip
