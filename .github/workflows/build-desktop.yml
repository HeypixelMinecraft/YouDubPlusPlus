name: Build YouDubPlusPlus

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows desktop
            artifact: YouDubPlusPlus-windows
          - os: macos-latest
            name: macOS desktop
            artifact: YouDubPlusPlus-macos
          - os: ubuntu-latest
            name: Linux desktop
            artifact: YouDubPlusPlus-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Create environment
        run: |
          uv venv --python 3.12 .venv
          uv pip install -r requirements-ci.txt

      - name: Run backend smoke tests
        run: |
          uv run python -m pytest backend/tests/test_index_tts.py backend/tests/test_pipeline.py

      - name: Compile desktop sources
        run: |
          uv run python -m compileall apps/desktop/youdub_desktop apps/desktop/main.py backend/app

      - name: Import desktop entrypoint
        run: |
          uv run python -c "import sys; sys.path.insert(0, 'apps/desktop'); import youdub_desktop.main; from youdub_desktop.ui.app_window import AppWindow; print('desktop imports ok')"

      - name: Build desktop package
        run: |
          uv run pyinstaller --noconfirm apps/desktop/YouDubPlusPlus.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/YouDubPlusPlus
